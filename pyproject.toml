[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dp-python-lib"
# Version is derived from the git tag by setuptools-scm (see [tool.setuptools_scm]); it is
# deliberately NOT hardcoded here, so the tag is the single source of truth at release time.
dynamic = ["version"]
description = "Python client library for the MLDP gRPC API"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Osprey Distributed Control Systems" }]
keywords = ["mldp", "grpc", "data-platform", "time-series", "epics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  # Minimums match what the generated gRPC stubs hard-require at import time
  # (see GRPC_GENERATED_VERSION / ValidateProtobufRuntimeVersion in src/dp_python_lib/grpc);
  # keep these in sync with the stub generator when regenerating.
  #
  # NOTE: grpcio-tools is deliberately NOT here.  It is the protoc toolchain used to *generate*
  # the stubs, not to run them -- nothing under src/ imports grpc_tools.  Requiring it at runtime
  # would force every consumer to install the compiler.  It lives in the [codegen] extra instead.
  "grpcio>=1.82.1",
  "protobuf>=7.35.0",
  "pydantic-settings",
  "PyYAML",
]

[project.urls]
Homepage = "https://github.com/osprey-dcs/dp-python-lib"
Repository = "https://github.com/osprey-dcs/dp-python-lib"
Issues = "https://github.com/osprey-dcs/dp-python-lib/issues"

[project.optional-dependencies]
# Pythonic query-result conversions (query_conversions): DataFrame / NumPy / Excel.  Kept out of the core
# install so the gRPC client stays lightweight; imported lazily.  openpyxl is the Excel engine and is NOT
# implied by pandas, so it is listed explicitly.
analysis = [
  "pandas",
  "numpy",
  "openpyxl",
]

# Development tooling.  Not required to use the library.  mypy backs the cookbook snippet
# checker (.dev/tools/check-cookbook-snippets.py), which type-checks every example in
# doc/cookbook against this package to catch wrong attribute/method names in the docs.
dev = [
  "mypy",
  "pytest",
  "ruff",
  "build",
  "twine",
]

# Toolchain for regenerating the gRPC stubs in src/dp_python_lib/grpc from the upstream
# dp-grpc protos.  Not needed to use or develop against the library.
codegen = [
  "grpcio-tools>=1.82.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Release tags are `rel-X.Y.Z`; the default regex expects `v` or a bare number, so it is
# overridden here.  Without this, setuptools-scm cannot parse the project's tags at all.
tag_regex = '^rel-(?P<version>[0-9]+\.[0-9]+\.[0-9]+.*)$'
# Only `rel-*` tags define versions.  Other tags in this repo (e.g. the legacy `v1.13`) are
# ignored rather than being misread as releases.
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "rel-*"]
# Non-tagged commits get the NEXT patch version with a .devN suffix, rather than appearing to
# be a later release than they are.
version_scheme = "guess-next-dev"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a live MLDP ecosystem on localhost:50051-50053 (deselect with '-m \"not integration\"')",
]

[tool.ruff]
# 120 matches the margin this codebase was already written to: at line-length 100 there were
# 307 violations, nearly all docstrings and long string literals that the formatter will not
# rewrap; at 120 there are 3.  Reflowing that much prose by hand would be a large diff with no
# readability gain.
line-length = 120
target-version = "py310"
# The gRPC stubs are generated from the upstream dp-grpc protos and regenerated wholesale;
# linting or formatting them would be overwritten on the next regeneration.
#
# Markdown is excluded because ruff would reformat the Python snippets embedded in CLAUDE.md
# and doc/cookbook/*.md.  Those snippets are hand-wrapped for readability as documentation,
# and the cookbook examples are already verified independently by
# .dev/tools/check-cookbook-snippets.py, which type-checks them against this package.
extend-exclude = ["src/dp_python_lib/grpc", "*.md"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade -- requires-python is >=3.10, so modern syntax is available
  "B",         # flake8-bugbear
  "SIM",       # flake8-simplify
  "G",         # flake8-logging-format
  "DTZ",       # flake8-datetimez -- this library rejects naive datetimes, so they matter here
  "RUF",
]
ignore = [
  # The documented three-tier error handling deliberately ends with a broad `except Exception`
  # as the outermost tier (see CLAUDE.md, "gRPC Error Handling"), and config loading catches
  # broadly to re-raise as ValueError.  This is the intended design, not an oversight.
  "BLE001",
  # `int(round(x))` reads as deliberate in the nanosecond arithmetic in to_timestamp(); the
  # redundant cast documents the intent to land on an int.
  "RUF046",
  # ServiceApiClientBase and ApiResultBase inherit ABC to mark them as not-directly-instantiable
  # shared-implementation bases.  They intentionally have no abstract methods; adding one purely
  # to satisfy this rule would be worse than the warning.
  "B024",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately catch broadly in setUpClass to skip when no live server is present,
# and assert on private/underscore internals.
"tests/**" = ["BLE001"]


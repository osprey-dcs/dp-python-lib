[project]
name = "dp-python-lib"
version = "1.15.0"
description = "Python client library for the MLDP gRPC API"
requires-python = ">=3.10"

dependencies = [
  # Minimums match what the generated gRPC stubs hard-require at import time
  # (see GRPC_GENERATED_VERSION / ValidateProtobufRuntimeVersion in src/dp_python_lib/grpc);
  # keep these in sync with the stub generator when regenerating.
  "grpcio>=1.82.1",
  "grpcio-tools>=1.82.1",
  "protobuf>=7.35.0",
  "pydantic-settings",
  "PyYAML",
]

[project.optional-dependencies]
# Pythonic query-result conversions (query_conversions): DataFrame / NumPy / Excel.  Kept out of the core
# install so the gRPC client stays lightweight; imported lazily.  openpyxl is the Excel engine and is NOT
# implied by pandas, so it is listed explicitly.
analysis = [
  "pandas",
  "numpy",
  "openpyxl",
]

# Development tooling.  Not required to use the library.  mypy backs the cookbook snippet
# checker (.dev/tools/check-cookbook-snippets.py), which type-checks every example in
# doc/cookbook against this package to catch wrong attribute/method names in the docs.
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# 120 matches the margin this codebase was already written to: at line-length 100 there were
# 307 violations, nearly all docstrings and long string literals that the formatter will not
# rewrap; at 120 there are 3.  Reflowing that much prose by hand would be a large diff with no
# readability gain.
line-length = 120
target-version = "py310"
# The gRPC stubs are generated from the upstream dp-grpc protos and regenerated wholesale;
# linting or formatting them would be overwritten on the next regeneration.
#
# Markdown is excluded because ruff would reformat the Python snippets embedded in CLAUDE.md
# and doc/cookbook/*.md.  Those snippets are hand-wrapped for readability as documentation,
# and the cookbook examples are already verified independently by
# .dev/tools/check-cookbook-snippets.py, which type-checks them against this package.
extend-exclude = ["src/dp_python_lib/grpc", "*.md"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "UP",        # pyupgrade -- requires-python is >=3.10, so modern syntax is available
  "B",         # flake8-bugbear
  "SIM",       # flake8-simplify
  "G",         # flake8-logging-format
  "DTZ",       # flake8-datetimez -- this library rejects naive datetimes, so they matter here
  "RUF",
]
ignore = [
  # The documented three-tier error handling deliberately ends with a broad `except Exception`
  # as the outermost tier (see CLAUDE.md, "gRPC Error Handling"), and config loading catches
  # broadly to re-raise as ValueError.  This is the intended design, not an oversight.
  "BLE001",
  # `int(round(x))` reads as deliberate in the nanosecond arithmetic in to_timestamp(); the
  # redundant cast documents the intent to land on an int.
  "RUF046",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately catch broadly in setUpClass to skip when no live server is present,
# and assert on private/underscore internals.
"tests/**" = ["BLE001"]

